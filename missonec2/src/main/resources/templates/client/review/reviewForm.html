<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">
<head  >
<meta charset="UTF-8">
<title th:text="'お問い合わせ | ' + #{shop.title}"></title>
</head>
<link rel="stylesheet" th:href="@{/css/Review.css}">

<body>
<div > 
<div class="contact-container">

     <div id ="contact-container">
	<h2>Contact Us</h2>
	<p class="contact-text">
	    If you have any questions, suggestions, or feedback, please send us a message.
	    <br>
	   
		ご質問、ご要望がございましたら、お気軽にお書きください。
	   
	</p>



    <form th:action="@{/client/review/input}" method="post">

        <div class="form-group">
            <label>Your Name(氏名)</label>
            <input type="text"
                   name="name"
                   placeholder="Enter your name"
                   maxlength="50"
                   required>
        </div>

        <div class="form-group">
            <label>Email Address(アドレス)</label>
            <input type="email"
                   name="email"
                   placeholder="example@gmail.com"
                   maxlength="100"
                   required>
        </div>

        <div class="form-group">
            <label>Subject(タイトル)</label>
            <input type="text"
                   name="subject"
                   placeholder="Enter subject"
                   maxlength="100">
        </div>

        <div class="form-group">
            <label>Message(本文)</label>
            <textarea
                name="message"
                rows="7"
                placeholder="Please write your message here..."
                maxlength="1000"
                required></textarea>
        </div>

        <button type="submit" th:href="@{/}" class="send-btn">
            Send Message
        </button>
                 
       
            <a class="back_button" id="backBtn"   th:href="@{/}"> トップへ戻る </a>
        
        

    </form>
 

</div>
</div>
</div>
</body>
</html>
