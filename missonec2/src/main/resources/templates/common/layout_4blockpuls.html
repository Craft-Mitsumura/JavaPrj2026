<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
    th:fragment="layout(title,body)">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />
<link rel="stylesheet" type="text/css" th:href="@{/css/carousel.css}" />
<title  th:replace="${title}"></title>
</head>
<body class="user" style="margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">
	<!--/* ヘッダー */-->
	<header style="margin: 0; padding: 0;">
		<div th:replace="~{common/header :: layout-header}"></div>
	</header>
	<!--/* ナビゲーションバー */-->
	<nav th:if="${session.user == null or session.user.authority == 2}" class="navi_area">
		<div th:replace="~{common/menu :: layout-menu}"></div>
	</nav>
	 <!--/* カルーセル広告 */-->
	<!-- <div th:replace="~{common/carousel :: layout-carousel}"></div> -->
	<div class="container" style="flex: 1;">
		<!--/* メイン */-->
		<article class="main" style="margin-left:115px;">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer style="margin-top: auto;">
		<div th:replace="~{common/footer :: layout-footer}"></div>
	</footer>
</body>
</html>
