<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>景品変更 | [[#{shop.title}]]</title>
	<meta charset="UTF-8" />
</head>

<body class="admin prize_update_input">
	<div id="adminPrizeInput">

		<h2 class="title">景品変更</h2>
		<p class="input_message">変更する情報を入力してください。</p>

		<div class="user_info_form_area">
			<form th:action="@{/admin/prize/update/check}" th:object="${prizeForm}" method="post"
				enctype="multipart/form-data">

				<th:block th:if="${#fields.hasErrors()}">
					<ul class="error_list">
						<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}">
						</li>
					</ul>
				</th:block>

				<th:block th:if="${errorMessage}">
					<ul class="error_list">
						<li th:text="${errorMessage}"></li>
					</ul>
				</th:block>

				<input type="hidden" th:field="*{id}" />

				<ul class="input_list">

					<li>
						<label>
							<span class="input_title">景品名</span>
						</label>
						<input type="text" th:field="*{name}" />
					</li>

					<li>
						<label>
							<span class="input_title">必要ポイント</span>
						</label>
						<input type="number" th:field="*{requiredPoint}" />
					</li>

					<li>
						<label>
							<span class="input_title">説明</span>
						</label>
						<textarea rows="6" th:field="*{description}"></textarea>
					</li>

					<li>
						<label>
							<span class="input_title">画像</span>
						</label>

						<input type="file" th:field="*{imageFile}" id="imageFile" />

						<span th:unless="*{#strings.isEmpty(image)}">
							<img id="preview" th:src="@{/images/{image}(image=*{image})}" />
						</span>

						<span th:if="*{#strings.isEmpty(image)}">
							<img id="preview" th:src="@{/images/common/no_image.jpg}" />
						</span>
					</li>

				</ul>

				<input type="submit" value="確認" class="send_button" />

			</form>

			<form th:action="@{/admin/prize/show/{id}(id=${prizeForm.id})}" method="get">
				<input type="submit" value="戻る" class=back_button />
			</form>


		</div>
	</div>
	<!-- script追加:金城 -->
	<script>
		document.getElementById("imageFile").addEventListener("change", function (e) {
			const file = e.target.files[0];
			if (file) {
				document.getElementById("preview").src = URL.createObjectURL(file);
			}
		});
	</script>
</body>

</html>
