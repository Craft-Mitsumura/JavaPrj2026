<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
<!--	<title>広告登録入力 | シェアードショップ</title>-->
	<title th:text="'広告登録入力 | '+ #{shop.title}"> </title>
</head>

<body class="admin ad_regist_input">
	<div th:fragment="content" class="admin ad_list">
	<div id="admin">
		<h2 class="title">広告追加</h2>

		<div class="update ad_form">
			<form th:action="@{/admin/ad/regist/check}" method="post" th:object="${promotionsForm}"
				enctype="multipart/form-data">

				<div th:if="${#fields.hasErrors('*')}" style="margin-bottom: 20px;">
				    <th:block th:if="${#fields.hasErrors('pageName')}">
				        <span th:each="err : ${#fields.errors('pageName')}" 
				              th:if="${err.contains('必須')}" 
				              th:text="${err}" style="color:red;"></span><br th:if="${#fields.hasErrors('pageName')}" />
				    </th:block>
				        
				    <th:block th:if="${#fields.hasErrors('pageName')}">
				        <span th:each="err : ${#fields.errors('pageName')}" 
				              th:if="${err.contains('文字以内で入力')}" 
				              th:text="${err}" style="color:red;"></span><br th:if="${#fields.hasErrors('pageName')}" />
				    </th:block>

				    <th:block th:if="${#fields.hasErrors('body')}">
				        <span th:each="err : ${#fields.errors('body')}" 
				              th:if="${err.contains('必須')}" 
				              th:text="${err}" style="color:red;"></span><br th:if="${#fields.hasErrors('body')}" />
				    </th:block>
				        
				    <th:block th:if="${#fields.hasErrors('body')}">
				        <span th:each="err : ${#fields.errors('body')}" 
				              th:if="${err.contains('文字以内で入力')}" 
				              th:text="${err}" style="color:red;"></span><br th:if="${#fields.hasErrors('body')}" />
				    </th:block>
				</div>

				<div class="form">
					<div class="label">ページ名：</div>
					<div class="input">
						<input type="text" th:field="*{pageName}" />
					</div>
				</div>
				<div class="form">
					<div class="label">レイアウトタイプ：</div>
					<div class="input">
						<select th:field="*{layoutType}" id="layoutType">
							<option value="1">タイプ1</option>
							<option value="2">タイプ2</option>
							<option value="3">タイプ3</option>
						</select>
					</div>
				</div>
				<div class="form">
					<div class="label">レイアウト例：</div>
					<div class="input">
						<img id="layout-example-img" style="width: 200px; height: auto; border: 1px solid #ccc;" />
					</div>
				</div>
				<div class="form">
					<div class="label">サムネイル：</div>
					<div class="input">
						<input type="file" th:field="*{imageName}" onchange="previewImage(this, 'preview-imageName')" />

						<img id="preview-imageName" th:if="*{tempImageName == null}"
							th:src="@{/images/common/no_image.jpg}"
							style="width: 150px; height: 100px; object-fit: cover; display: block;" />

						<img id="preview-imageName" th:unless="*{tempImageName == null}"
							th:src="@{'/images/image_tmp/' + *{tempImageName}}"
							style="width: 150px; height: 100px; object-fit: cover; display: block;" />
					</div>
				</div>

				<div class="form">
					<div class="label">遷移先URL：</div>
					<div class="input">
						<input type="text" th:field="*{targetUrl}" />
					</div>
				</div>
				<div class="form">
					<div class="label">見出し：</div>
					<div class="input">
						<input type="text" th:field="*{adTitle}" />
					</div>
				</div>

				<div class="form">
					<div class="label">タイトル画像：</div>
					<div class="input">
						<input type="file" th:field="*{headingImage}"
							onchange="previewImage(this, 'preview-headingImage')" />

						<img id="preview-headingImage" th:if="*{tempHeadingImage == null}"
							th:src="@{/images/common/no_image.jpg}"
							style="width: 150px; height: 100px; object-fit: cover; display: block;" />

						<img id="preview-headingImage" th:unless="*{tempHeadingImage == null}"
							th:src="@{'/images/image_tmp/' + *{tempHeadingImage}}"
							style="width: 150px; height: 100px; object-fit: cover; display: block;" />
					</div>
				</div>

				<div id="image-list-container"></div>

				<div class="form">
					<div class="label">本文：</div>
					<div class="input">
						<textarea th:field="*{body}" rows="5" cols="40"></textarea>
					</div>
				</div>

				<div class="form">
					<div class="label">リンクリスト：</div>
					<div class="input" id="link-list-container">
					</div>
				</div>
				<div class="form">
					<div class="label"></div>
					<div class="input">
						<button type="button" id="addLinkBtn">リンクを追加</button>
					</div>
				</div>

				<template id="link-template">
					<div class="link-item" style="margin-bottom: 10px; border: 1px solid #ccc; padding: 5px;">
						<input type="text" class="js-link-text" placeholder="リンクテキスト" />
						<input type="text" class="js-link-url" placeholder="URL" />
						<button type="button" onclick="this.parentElement.remove()">削除</button>
					</div>
				</template>

				<div class="form">
					<div class="label">有効/無効：</div>
					<div class="input">
						<input type="checkbox" th:field="*{isActive}" value="1" /> 有効にする
					</div>
				</div>

				<div class="form">
					<div class="label"></div>
					<div class="input">
						<input type="submit" value="確認" />
					</div>
				</div>
			</form>

			<form th:action="@{/admin/ad/list}" method="get">
				<div class="form">
					<div class="label"></div>
					<div class="input">
						<input type="submit" value="一覧へ戻る" />
					</div>
				</div>
			</form>
		</div>
	</div>
</div>
	<script th:inline="javascript">
		// Thymeleafからパスを取得
		const noImagePath = /*[[@{/images/common/no_image.jpg}]]*/ '/images/common/no_image.jpg';
		const layoutBaseUrl = /*[[@{/images/layout_}]]*/ '/images/layout_';


		let linkCount = /*[[${promotionsForm.linkTexts != null ? promotionsForm.linkTexts.size() : 0}]]*/ 0;
		const layoutSelect = document.getElementById('layoutType');
		const imageContainer = document.getElementById('image-list-container');
		const exampleImg = document.getElementById('layout-example-img');

		// リンク追加処理
		document.getElementById('addLinkBtn').addEventListener('click', function () {
			const container = document.getElementById('link-list-container');
			const template = document.getElementById('link-template');
			const clone = template.content.cloneNode(true);

			// インデックス付きでnameを指定
			clone.querySelector('.js-link-text').name = "linkTexts[" + linkCount + "]";
			clone.querySelector('.js-link-url').name = "linkUrls[" + linkCount + "]";
			container.appendChild(clone);
			linkCount++;
		});

		// 画像プレビュー用共通関数
		function previewImage(input, previewId) {
			const preview = document.getElementById(previewId);
			if (input.files && input.files[0]) {
				const reader = new FileReader();
				reader.onload = function (e) {
					preview.src = e.target.result;
					preview.style.display = 'block';
				}
				reader.readAsDataURL(input.files[0]);
			}
		}

		// レイアウト更新処理
		function updateLayoutPreview() {
			const layoutType = layoutSelect.value;

			exampleImg.onerror = function () {
				this.onerror = null;
				this.src = noImagePath;
			};
			exampleImg.src = layoutBaseUrl + layoutType + '.jpg';

			// サーバーから渡された一時ファイル名のリスト（Thymeleafから取得）
			const tempImageSrcs = /*[[${promotionsForm.tempImageSrcs}]]*/[];
			const imageTexts = /*[[${promotionsForm.imageTexts}]]*/[];
			const imageAlts = /*[[${promotionsForm.imageAlts}]]*/[];

			const count = parseInt(layoutType);
			imageContainer.innerHTML = '';

			for (let i = 0; i < count; i++) {
				const imgId = `preview-img-${i}`;

				// サーバーにデータがあればそのパス、なければ noImagePath を使用
				const imgSrc = (tempImageSrcs && tempImageSrcs[i])
					? '/images/image_tmp/' + tempImageSrcs[i]
					: noImagePath;

				const textValue = (imageTexts && imageTexts[i]) ? imageTexts[i] : '';
				const altValue = (imageAlts && imageAlts[i]) ? imageAlts[i] : '';

				const div = document.createElement('div');
				div.className = 'form';
				div.innerHTML = `
            <div class="label">画像${i + 1}：</div>
            <div class="input">
                <input type="file" name="imageSrcs[${i}]" onchange="previewImage(this, '${imgId}')" />
                <img id="${imgId}" src="${imgSrc}" style="width: 150px; height: 100px; object-fit: cover; margin-top: 5px; display: block;" />
                <input type="text" name="imageTexts[${i}]" value="${textValue}" placeholder="説明" />
                <input type="text" name="imageAlts[${i}]" value="${altValue}" placeholder="ALT" />
            </div>
        `;
				imageContainer.appendChild(div);
			}
		}

		// ページ読み込み時
		document.addEventListener('DOMContentLoaded', function () {
			// 初期画像の表示設定
			document.getElementById('preview-imageName').src = noImagePath;
			document.getElementById('preview-imageName').style.display = 'block';
			document.getElementById('preview-headingImage').src = noImagePath;
			document.getElementById('preview-headingImage').style.display = 'block';

			// イベントリスナー登録
			layoutSelect.addEventListener('change', updateLayoutPreview);

			// 初回実行
			updateLayoutPreview();
		});
	</script>
</body>

</html>
