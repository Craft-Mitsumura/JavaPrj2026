<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
</head>
<body>

	<div th:fragment="layout-header" id="containerd">

    <!-- Left : Logo -->
    <div class="header-left">
        <a href="/shared_shop">
            <img id="mainLogo" alt="avoir"  th:src="#{shop.logo}">
        </a>
    </div>

    <!-- Center : Menu -->
    <div class="header-center">
        <ul class="menu-list">
            <li><a th:href="@{/}" th:text="#{top}"></a></li>

            <li>
                <a th:href="@{/client/item/list/1}"
                   th:text="#{item}+#{title.list}"></a>
            </li>

            <li>
                <a th:href="@{/client/basket/list}" th:text="#{basket}"></a>
            </li>

            <th:block th:if="${session.user != null}">
                <li>
                    <a th:href="@{/client/order/list}"
                       th:text="#{order}+#{title.list}"></a>
                </li>
            </th:block>
        </ul>
    </div>

    <!-- Search Section (sidebar bata moved) -->
    <div class="header-search"
         th:if="${session.user == null or session.user.authority == 2}">

        <form th:if="${sortType == null}" th:action="@{/client/item/list/1}">
          <input type="text" name="keyword" placeholder="キーワード"> 
          <!-- <select name="categoryId">
                <option th:value="#{constants.category.select.none.no}"
                        th:text="#{constants.category.select.none}"></option>

                <option th:each="category: ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"></option>
            </select>  -->
 
            <input type="submit" th:value="#{select}" />
        </form>

        <form th:unless="${sortType == null}"
              th:action="@{/client/item/list/} + ${sortType}">

            <select name="categoryId">
                <option th:value="#{constants.category.select.none.no}"
                        th:text="#{constants.category.select.none}"></option>

                <option th:each="category: ${categories}"
                        th:value="${category.id}"
                        th:text="${category.name}"
                        th:selected="${category.id} == ${categoryId}">
                </option>
            </select>

            <input type="submit" th:value="#{select}" />
        </form>
    </div>

    <!-- Right : User -->
    <div class="header-right">

        <div th:if="${session.user != null and session.user.authority == 2}" class="user_info">
            <a th:href="@{/client/user/detail}" th:text="${session.user.name}"></a>さん |
            <a th:href="@{/logout}" th:text="#{logout}"></a>
        </div>

        <div th:if="${session.user != null and (session.user.authority == 0 or session.user.authority == 1)}"
             class="user_info">
            <a th:href="@{/admin/user/detail/{id}(id=${session.user.id})}"
               th:text="${session.user.name}"></a>さん |
            <a th:href="@{/logout}" th:text="#{logout}"></a>
        </div>

        <div th:if="${session.user == null}" class="user_info">
            <a class="login-btn" th:href="@{/login}" th:text="#{login}"></a>
            <a class="signup-btn"
               th:href="@{/client/user/regist/input/init}"
               th:text="#{client.regist}"></a>
        </div>

    </div>
</div>
</body>
</html>
