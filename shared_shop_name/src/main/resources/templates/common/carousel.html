<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
	<div th:fragment="layout-carousel" class="carousel-container">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/normalize-css@2.3.1/normalize.css">
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />

		<style>
			/* 共通設定 */
			:root {
				--swiper-theme-color: #D4AF37;
			}

			.wrapper {
				overflow-x: hidden;
				width: 100%;
				padding-bottom: 5px;
			}

			/* .swiper にクラス名を統一し、overflow: visible で左右のスライドが見えるようにします */
			.sample-swiper-coverflow .swiper {
				position: relative;
				overflow: visible;
				width: 100%;
				max-width: 1000px;
				height: 250px;
				margin: 0 auto;
				padding-bottom: 40px;
			}

			/* 飛び出たスライドの対策 */
			.sample-swiper-coverflow {
				overflow: visible;
				width: 100%;
			}

			/* スライド内要素の配置 */
			.swiper-slide {
				display: flex;
				justify-content: center;
				align-items: center;
			}

			.carousel-item {
				width: 100%;
				height: 100%;
			}

			.carousel-item a,
			.carousel-item img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center;
				background-color: #f5f5f5;
			}

			/* ページネーション：コンテナ */
			.sample-swiper-coverflow .swiper-pagination {
				background-color: transparent;
				border: 2px solid var(--swiper-theme-color);
				padding: 5px 15px;
				border-radius: 20px;
				width: auto;
				left: 50%;
				transform: translateX(-50%);
				bottom: -5px;
			}

			/* ページネーション：ドット */
			.sample-swiper-coverflow .swiper-pagination-bullet {
				background: var(--swiper-theme-color);
				opacity: 0.5;
				border: 1px solid #ffffff;
			}

			.sample-swiper-coverflow .swiper-pagination-bullet-active {
				opacity: 1;
			}
		</style>

		<div class="wrapper">
			<div class="sample-swiper-coverflow">
				<!-- Slider main container -->
				<div class="swiper">
					<!-- Additional required wrapper -->
					<div class="swiper-wrapper">
						<!-- Slides -->
						<div class="swiper-slide" th:each="ad : ${adList}">
							<div class="carousel-item">

								<a th:if="${ad.imageName != null}"
									th:href="@{/client/ad/page/{id}(id=${ad.category.id})}">
									<img th:src="@{/images/uploads/{image}(image=${ad.imageName})}" alt="広告画像" />
								</a>

								<img th:if="${ad.imageName == null}" th:src="@{/images/common/no_image.jpg}"
									alt="画像なし" />

							</div>
						</div>
						<div class="swiper-slide" th:if="${#lists.isEmpty(adList)}">
							<div class="carousel-item">
								<img th:src="@{/images/common/no_image.jpg}" alt="データがありません" />
							</div>
						</div>
					</div>

					<!-- If we need pagination -->
					<div class="swiper-pagination"></div>
					<!-- If we need navigation buttons -->
				</div>
			</div>
		</div>

		<script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
		<script type="text/javascript">
			const defaultOptions = {
				// ドットインジケーターの表示
				pagination: {
					el: ".swiper-pagination",
					clickable: true,
				},

				loop: true,// ループの有効化

				autoplay: {
					delay: 4000,             // 3000ミリ秒（3秒）ごとにスライド
					disableOnInteraction: false, // ユーザーが操作しても自動再生を止めない
				},
			}

			// カバーフローエフェクト
			// セレクタを .swiper に合わせて、CoverFlow のオプションを設定
			const swiper = new Swiper(".sample-swiper-coverflow .swiper", {
				...defaultOptions,
				slidesPerView: 1.3,      /* 表示するスライドの枚数 */
				centeredSlides: true,    /* スライドの中央揃え　有効化 */
				spaceBetween: 20,
				effect: "coverflow",     /* カバーフローエフェクトを有効化 */
				coverflowEffect: {
					rotate: 0,           /* スライドの回転角度 */
					stretch: 0,         /* スライドの間隔（px単位） */
					depth: 150,          /* 奥行き感（左右の画像をどれだけ奥に引っ込めるか） */
					scale: 1,
					slideShadows: true,  /* 先頭スライドの影を有効化 */
				},
			});
		</script>
	</div>
</body>

</html>
