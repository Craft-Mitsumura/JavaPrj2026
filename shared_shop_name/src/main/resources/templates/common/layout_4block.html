<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title,body)">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/layout.css}" />
	<link rel="stylesheet" type="text/css" th:href="@{/css/stylesheet.css}" />

	<link rel="stylesheet" th:href="@{/css/prize.css}" />
	<title th:replace="${title}">シェアードショップ</title>
</head>

<body class="admin" style="margin: 0; padding: 0; min-height: 100vh; display: flex; flex-direction: column;">
	<!--/* ヘッダー */-->
	<header style="margin: 0; padding: 0;">
		<div th:replace="~{common/header :: layout-header}"></div>
	</header>
	<div class="container" style="flex: 1; display: flex;">

		<article class="main">
			<div th:replace="${body}"></div>
		</article>
	</div>
	<!--/* フッター */-->
	<footer style="margin-top: auto;">
		<div th:replace="~{common/footer :: layout-footer}"></div>
	</footer>
</body>

</html>
