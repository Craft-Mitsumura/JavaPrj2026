<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title>景品登録確認 | [[#{shop.title}]]</title>
	<meta charset="UTF-8" />
</head>

<body class="admin prize_regist_check">

	<div id="adminPrizeCheck">
		<h2 class="title">景品登録確認</h2>
		<p class="check_message">以下の内容で登録します。</p>

		<div class="user_info_form_area">
			<ul class="input_list" th:object="${prizeForm}">

				<li>
					<span class="input_title">景品名</span>
					<span class="input_value" th:text="*{name}"></span>
				</li>

				<li>
					<span class="input_title">必要ポイント</span>
					<span class="input_value" th:text="*{#numbers.formatInteger(requiredPoint, 0, 'COMMA')}"></span>
				</li>

				<li>
					<span class="input_title">説明</span>
					<span class="input_value" th:text="*{description}"></span>
				</li>

				<li>
					<span class="input_title">画像</span>
					<span class="input_value">
						<img th:if="*{image != null}" th:src="@{/images/{image}(image=*{image})}" />
						<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}" />
					</span>
				</li>

			</ul>

			<form th:action="@{/admin/prize/regist/complete}" method="post">
				<input type="submit" value="登録" class="send_button" />
			</form>

			<form th:action="@{/admin/prize/regist/input}" method="post">
				<input type="submit" value="戻る" class="back_button" />
			</form>
		</div>
	</div>

</body>

</html>
