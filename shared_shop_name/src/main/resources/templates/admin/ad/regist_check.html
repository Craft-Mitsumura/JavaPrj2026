<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<title th:text="'カテゴリカルーセル登録確認 | '+ #{shop.title}"> </title>
</head>

<body class="admin ad_regist_check">
	<div th:fragment="content" class="admin ad_list">
		<div id="adminItemInput">
			<h2 class="title">カルーセル式カテゴリ登録確認</h2>
			<p class="check_message">登録内容をご確認ください。</p>

			<div class="user_info_form_area">
				<ul class="input_list" th:object="${registForm}">
					<!-- 1. 管理名 -->
					<li>
						<span class="input_title">管理名</span>
						<span class="input_value" th:text="*{pageName}"></span>
					</li>

					<!-- 2. 画像プレビュー -->
					<li>
						<span class="input_title">画像</span>
						<span class="input_value">
							<img th:if="*{tempImageName != null}" th:src="@{'/images/image_tmp/' + *{tempImageName}}" />
							<img th:unless="*{tempImageName != null}" th:src="@{/images/common/no_image.jpg}" />
						</span>
					</li>

					<!-- 3. 遷移先カテゴリ名 -->
					<li>
						<span class="input_title">遷移先カテゴリ</span>
						<span class="input_value" th:text="${selectedCategory != null ? selectedCategory.name : ''}"></span>
					</li>

					<!-- 4. 有効/無効 -->
					<li>
						<span class="input_title">有効/無効</span>
						<span class="input_value" th:text="*{isActive == 1 ? '有効' : '無効'}"></span>
					</li>
				</ul>

				<!-- 登録実行フォーム -->
				<form th:action="@{/admin/ad/regist/complete}" method="post" class="user_info_form" th:object="${registForm}">
					<input type="hidden" th:field="*{pageName}" />
					<input type="hidden" th:field="*{tempImageName}" />
					<input type="hidden" th:field="*{categoryId}" />
					<input type="hidden" th:field="*{isActive}" />

					<input type="submit" value="登録" class="send_button" />
				</form>

				<!-- 入力画面へ戻るフォーム -->
				<form th:action="@{/admin/ad/regist/input}" method="get" th:object="${registForm}">
					<input type="hidden" th:field="*{pageName}" />
					<input type="hidden" th:field="*{tempImageName}" />
					<input type="hidden" th:field="*{categoryId}" />
					<input type="hidden" th:field="*{isActive}" />

					<input type="submit" value="戻る" class="back_button" />
				</form>
			</div>
		</div>
	</div>
</body>

</html>
