<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<meta charset="UTF-8" />
	<title th:text="'カテゴリカルーセル削除確認 | '+ #{shop.title}"> </title>
</head>

<body class="admin ad_delete_check">
	<div th:fragment="content" class="admin ad_list">
		<div id="adminItemDeleteCheck">
			<h2 class="title">カルーセル式カテゴリ削除確認</h2>
			<p class="check_message">以下の内容を削除します。よろしいですか？</p>

			<div class="user_info_form_area" th:object="${updateForm}">
				<input type="hidden" th:field="*{id}" />
				<ul class="input_list">
					<!-- 1. 管理名 -->
					<li>
						<span class="input_title">管理名</span>
						<span class="input_value" th:text="*{pageName}"></span>
					</li>
					<!-- 2. 画像プレビュー -->
					<li>
						<span class="input_title">画像</span>
						<span class="input_value">
							<img th:if="*{tempImageName != null}" th:src="@{'/images/uploads/' + *{tempImageName}}"/>
							<img th:unless="*{tempImageName != null}" th:src="@{/images/common/no_image.jpg}"/>
						</span>
					</li>
					<!-- 3. 遷移先カテゴリ名 -->
					<li>
						<span class="input_title">遷移先カテゴリ</span>
						<span class="input_value" th:text="${selectedCategory != null ? selectedCategory.name : ''}"></span>
					</li>
					<!-- 4. 有効/無効 -->
					<li>
						<span class="input_title">有効/無効</span>
						<span class="input_value" th:text="*{isActive == 1 ? '有効' : '無効'}"></span>
					</li>
				</ul>

				<!-- 削除実行フォーム -->
				<form th:action="@{/admin/ad/delete/complete}" method="post" th:object="${updateForm}" class="user_info_form">
					<input type="hidden" th:field="*{id}" />
					<input type="submit" value="削除" class="delete" />
				</form>

				<!-- 一覧画面（または戻る）フォーム -->
				<form th:action="@{/admin/ad/list}" method="get">
					<input type="submit" value="戻る" class="back_button" />
				</form>
			</div>
		</div>
	</div>
</body>

</html>
