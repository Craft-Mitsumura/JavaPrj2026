<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_3block :: layout(~{::title},~{::body/content()})}">

<head>
<meta charset="UTF-8">
<title th:text=" 'カルーセル式カテゴリ削除かくにん  | '+ #{shop.title}"></title>

</head> 
<body>
<div id="adConfirm">

    <h1 class="page-title">カルーセル式カテゴリ削除確認</h1>

    <p class="confirm-message">
        以下のカルーセル式カテゴリを削除します。よろしいですか？
    </p>

    <div class="ad-card" th:each="items : ${items}">

        <table class="confirm-table">

            <tr>
                <th>画像名</th>
                <td th:text="${items.imageName}"></td>
            </tr>

            <tr>
                <th>レイアウト</th>
                <td th:text="${items.layoutType}"></td>
            </tr>

            <tr>
                <th>コンテンツ</th>
                <td class="content" th:text="${items.contentJson}"></td>
            </tr>

            <tr>
                <th>リンク先</th>
                <td>
                    <a th:href="${items.targetUrl}"
                       th:text="${items.targetUrl}"
                       target="_blank"></a>
                </td>
            </tr>

            <tr>
                <th>公開状態</th>
                <td>
                    <span th:if="${items.isActive}" class="status active">
                        公開中
                    </span>

                    <span th:unless="${items.isActive}" class="status inactive">
                        非公開
                    </span>
                </td>
            </tr>

            <tr>
                <th>削除フラグ</th>
                <td th:text="${items.deleteFlag}"></td>
            </tr>

            <tr>
                <th>登録日</th>
                <td th:text="${#temporals.format(items.insertDate,'yyyy/MM/dd HH:mm')}"></td>
            </tr>

        </table>

        <div class="button-area">
            <a th:href="@{/admin/ad/list}" class="btn cancel">
                キャンセル
            </a>

			<form th:action="@{/admin/ad/delete/execute}" method="post">
			    <input type="hidden" name="id" th:value="${items.id}">
			    <button
			        class="btn delete"
			        type="submit"
			        style="width:220px; height:55px; font-size:18px;">
			        削除する
			    </button>
			</form>
			
        </div>

    </div>

</div>
</body>
</html>
