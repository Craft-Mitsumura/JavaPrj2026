<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{item}+#{title.list}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body th:object="${loginForm}" class="user item_list">
	<div id="itemList">

		<!-- 商品一覧タイトル -->
		
		<div class="section-ja">
			<h2 class="section-en" th:text="#{item}+#{title.list}"></h2>

		</div>
		<h2 th:text="${allsubtittle}" class="section-text"></h2>

		<p th:text="${allsubtittleex}" class="section-text"></p>

		<!-- 並び替えメニュー -->
		<div class="sorted_by">

			<!-- カテゴリ絞り込み -->
			<div class="category-list">

				<a th:href="@{/client/item/list/1}">
					すべて
				</a>

				<th:block th:each="category : ${categories}">
					<a th:href="@{/client/category/lists/{id}(id=${category.id})}" th:text="${category.name}">
					</a>
				</th:block>

			</div>

			<!-- ランキング -->
			<a th:href="@{/client/item/ranking}">ランキング</a>

		</div>

		<!-- 商品が存在しない場合のメッセージ -->
		<p class="noItem" th:if="${#lists.isEmpty(items)}" th:text="#{msg.client.item.list.none}">
		</p>

		<!-- 商品一覧表示 -->
		<div class="item-grid" th:if="!${#lists.isEmpty(items)}">

			<!-- 商品情報を繰り返し表示 -->
			<div class="item-card" th:each="item : ${items}">

				<!-- 商品画像（クリックで商品詳細へ） -->
				<a class="item-image" th:href="@{/client/item/detail/{id}(id=${item.id})}">

					<!-- 商品画像が登録されている場合 -->
					<img th:if="${item.image!=null}" th:src="@{/images/{image}(image=${item.image})}">

					<!-- 商品画像が未登録の場合 -->
					<img th:unless="${item.image!=null}" th:src="@{/images/common/no_image.jpg}">

				</a>

				<!-- 商品情報 -->
				<div class="item-info">

					<!-- カテゴリ名 -->
					<div class="category" th:text="${item.category.Name}">
					</div>

					<!-- 商品名 -->
					<div class="name">

						<a th:href="@{/client/item/detail/{id}(id=${item.id})}" th:text="${item.name}">
						</a>

					</div>

					<!-- 商品価格 -->
					<div class="price">

						¥<span th:text="${item.price}"></span>

					</div>

				</div>

			</div>

		</div>

	</div>
	<div class="page-button" th:if="${page != null}">

		<div class="page-button">
			<!-- 前へ -->
			<a th:if="${page.hasPrevious()}" th:href="${categoryId != null} ?
		       @{/client/category/lists/{id}(id=${categoryId},page=${page.number-1})} :
		       @{/client/item/list/1(page=${page.number-1})}">
				前へ</a>

			<!--現在ページ-->
			<span th:text="${page.number + 1 + ' / ' + page.totalPages + 'ページ'}"></span>

			<!-- 次へ -->
			<a th:if="${page.hasNext()}" th:href="${categoryId != null} ?
		       @{/client/category/lists/{id}(id=${categoryId},page=${page.number+1})} :
		       @{/client/item/list/1(page=${page.number+1})}">
				次へ
			</a>

		</div>

	</div>
</body>


</html>
