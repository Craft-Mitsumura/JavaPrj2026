<!doctype html>
<html xmlns:th="http://thymeleaf.org" th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{ranking.title}+' | '+ #{shop.title.customize}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="">
	<div class="flex flex-col w-full">
		<div class="text-center mt-5">
			<h1 class="font-medium text-4xl mb-2">ランキング</h1>
			<h2 th:text="${currentMonthText}" class="text-gray-400"></h2>
			<div class="text-xs text-gray-400">人気の商品をランキング形式でご紹介します</div>
		</div>



			<!--	 カテゴリーの表示 -->
			<div class="text-center mt-6">
				<th:block th:each="category : ${categories}">
					<!--  クリック時にカテゴリーIDをURLパラメータとして送信するリンクに変更 -->
					<a th:href="@{/client/item/ranking/(categoryId=${category.id})}" th:text="${category.name}"
						th:if="${categoryId_ == category.id}"
						class="text-xs mx-2 px-8 py-1 bg-[#FFF7F4] rounded-2xl shadow-md "></a>
				
				</th:block>
			</div>

			<!--				 ランキング商品の表示 -->
			<th:block th:each="rankings: ${rankings}" th:if="${stat.index &lt; 10}">


					<a th:href="@{/client/item/detail/}+*{id}">
						<div class="relative">
						<div th:text="${stat.count}"></div>


							<img th:src="@{/images/{image}(image=*{image})}" th:if="*{image != null}"
								class="w-full h-75 object-cover" />


							<img th:src="@{/images/common/no_image.jpg}" th:if="*{image == null}"
								class="w-full h-75 object-cover" />

							<div class="absolute top-4 left-4">

							</div>
							<img th:src="@{/images/common/crone.png}" class="w-5 absolute top-5 left-6">
						</div>

						<div class="pt-3 pb-3 px-6 text-left">

							<h2 class="text-lg mb-2" th:text="*{name}"></h2>
						</div>
					</a>

				</div>
			</th:block>
			

			<!-- 今月のランキング商品がない場合の表示 -->
			<div th:if="${#lists.isEmpty(rankings)}" class="flex justify-center items-center min-h-100">
				<p>今月のランキングデータはありません。</p>
			</div>
		</div>
</body>

</html>
