<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{user}+#{title.input.check}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user user_regist_check">
	<h2 th:class="title" th:text="#{user}+#{title.input.check}"></h2>
	<p th:class="check_message" th:text="#{msg.regist.check}"></p>
	<div class="user_info_form_area">
		<ul class="input_list" th:object="${userForm}">
			<li>
				<label>
					<span class="input_title">[[#{userForm.e,ail}]]</span>
					<span th:if="${#fields.hasErrors('email')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<span class="input_value" th:text="*{email}"></span>
			</li>
			<li>
				<label>
					<span class="input_title">[[#{userForm.password}]]</span>
					<span th:if="${#fields.hasErrors('password')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<span class="input_value">********</span>
			</li>
			<li>
				<label>
					<span class="input_title">[[#{userForm.name}]]</span>
					<span th:if="${#fields.hasErrors('name')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<input type="text" th:field="*{name}" />
			</li>
			<li>
				<label>
					<span class="input_title">[[#{userForm.postalCode}]]</span>
					<span th:if="${#fields.hasErrors('postalCode')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<span class="input_value" th:text="*{postalCode}"></span>
			</li>
			<li>
				<label>
					<span class="input_title">[[#{userForm.address}]]</span>
					<span th:if="${#fields.hasErrors('address')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<span class="input_value" th:text="*{address}"></span>
			</li>
			<li>
				<label>
					<span class="input_title">[[#{userForm.phoneNumber}]]</span>
					<span th:if="${#fields.hasErrors('phoneNumber')}" th:text="#{msg.regist.input}"
						class="error_msg_inline"></span>
				</label>
				<span class="input_value" th:text="*{ChoneNumber}"></span>
			</li>
		</ul>


		<form th:action="@{/client/user/regist/complete}" method="post" class="user_info_form">
			<input type="submit" value="登録" class="send_button" />
		</form>
		<form th:action="@{/client/user/regist/input/init}" method="get" class="update">
			<input type="submit" value="戻る" class="back_button" />
		</form>
	</div>
</body>

</html>
