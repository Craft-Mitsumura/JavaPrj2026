<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{basket}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user shopping_basket">

	<h2 th:class="title" th:text="#{basket}"></h2>

	<th:block th:if="${itemNameListLessThan != null || itemNameListZero != null}">
		<br />
		<!--/* 在庫不足商品 */-->
		<ul class="error_list_no_mark" th:if="${itemNameListLessThan != null}">
			<li th:each="err : ${itemNameListLessThan}" th:text="#{msg.basket.stock.short(${err})}"></li>

		</ul>
		<!--/* 在庫なし商品 */-->
		<ul class="error_list_no_mark" th:if="${itemNameListZero != null}">
			<li th:each="err : ${itemNameListZero}" th:text="#{msg.basket.stock.none(${err})}"></li>
		</ul>
		<br />
	</th:block>

	<div th:if="${session.basketBeans == null}">
		<!--/* 買い物かごが空のとき */-->
		<p th:text="#{msg.basket.list.none}"></p>

		<a th:href="@{/client/item/list/1}" id="itemListBtn" class="back_button"> 商品一覧へ戻る </a>
	</div>

	<th:block th:if="${session.basketBeans != null}">
		<table class="list_table basket">
			<tr>
				<th>[[#{data.basket.item.name}]]</th>
				<th>刻印内容</th> <!-- 追加 -->
				<th>[[#{data.basket.count}]]</th>
				<th>商品金額</th>
				<th>[[#{data.basket.operate}]]</th>
				<th>[[#{data.basket.stock.status}]]</th>
			</tr>
			<tr th:each="item, status: ${session.basketBeans}">
				<td><a th:href="@{/client/item/detail/{id}(id=${item.id}, isEngravingSelected=${item.isEngravingSelected}, engravingText=${item.engravingText}, fontType=${item.fontType})}"
						th:text="${item.name}"></a></td>
				<td>
					<th:block th:if="${item.isEngravingSelected}">
						<div style="font-size: 0.9em; color: #555;">
							内容: <span th:text="${item.engravingText}"></span><br>
							フォント: <span th:text="${item.fontType}"></span>
						</div>
					</th:block>
					<th:block th:unless="${item.isEngravingSelected}">
						<span>-</span>
					</th:block>
				</td>
				<td th:text="${item.orderNum}"></td>

				<td>
					¥<span th:text="${#numbers.formatInteger(item.price * item.orderNum, 0, 'COMMA')}"></span>
				</td>

				<td>
					<form th:action="@{/client/basket/delete}" method="post">
						<input type="hidden" name="id" th:value="${item.id}" />
						<input type="hidden" name="engravingId" th:value="${item.engravingId}" /> <!-- 追加 -->
						<input type="submit" value="削除" class="delete" />
					</form>
				</td>
				<td th:if="${item.stock == 0}" th:text="#{data.out.of.stock}"></td>
				<td th:if="${item.stock > 5}" th:text="#{data.in.stock}"></td>
				<td th:if="${item.stock >= 1 and 5 >= item.stock }" th:text="${item.stock}"></td>

			</tr>
		</table>


		<th:block th:if="${session.basketBeans != null}">
			<div class="basket_total">
				合計金額：
				<span th:text="${#numbers.formatInteger(totalPrice, 0, 'COMMA')}"></span>円
			</div>
		</th:block>
		<div class="user_info_form_area shopping_button">
			<!--/* 注文手続きフォーム */-->
			<form th:action="@{/client/order/address/input}" method="post">
				<input type="submit" value="ご注文のお手続き" class="orderBtn" />
			</form>
			<!--/* 買い物かごを空にするフォーム */-->
			<form th:action="@{/client/basket/allDelete}" method="post">
				<input type="submit" value="買い物かごを空にする" onclick="return confirm('本当に削除しますか？')" id="deleteBtn" />
			</form>
		</div>
	</th:block>

	<th:block id="randomItems">
		<div class="ecommerce-section">
			<!--title -->
			<h2 class="section-title">おすすめ商品 <span class="subtitle">Recommended For You</span></h2>

			<!-- products -->
			<div class="products-grid">
				<div class="item-card" th:each="item : ${items}">

					<!--  -->
					<div class="card-image-wrapper">
						<!-- favorite btn -->
						<form th:action="@{/client/favorite/add}" method="POST" class="favorite-form">
							<input type="hidden" name="itemId" class="favoriteItemId" th:value="${item.id}" />

							<button type="button" class="btn-favorite" aria-label="Add to favorite"
								th:classappend="${favoriteItemIds != null and favoriteItemIds.contains(item.id)} ? ' favorite' : ''">

								<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
									th:attr="fill=${favoriteItemIds != null and favoriteItemIds.contains(item.id)} ? 'currentColor' : 'none'"
									stroke="currentColor" stroke-width="2" stroke-linecap="round"
									stroke-linejoin="round" class="heart-icon">

									<path
										d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
									</path>

								</svg>
							</button>
						</form>

						<!-- img links  -->
						<a class="item-image-link" th:href="@{/client/item/detail/{id}(id=${item.id})}">
							<img th:if="${item.image != null}" th:src="@{/images/{image}(image=${item.image})}"
								th:alt="${item.name}" class="product-img">
							<img th:unless="${item.image != null}" th:src="@{/images/common/no_image.jpg}"
								alt="No Image" class="product-img">
						</a>
					</div>

					<!-- carts info -->
					<div class="item-info">
						<!-- category-->
						<span class="category" th:text="${item.category.name}"></span>

						<!-- items name -->
						<h3 class="name">
							<a th:href="@{/client/item/detail/{id}(id=${item.id})}" th:text="${item.name}"></a>
						</h3>

						<!-- price and buttonsection -->
						<div class="card-footer">
							<div class="price">
								<span class="currency">¥</span><span
									th:text="${#numbers.formatInteger(item.price, 0, 'COMMA')}"></span>
							</div>


							<form th:action="@{/client/basket/add}" method="post" class="cart-form">


								<input type="hidden" name="id" th:value="${item.id}" />


								<input type="hidden" name="purchaseType" value="single" />
								<input type="hidden" name="formColor" value="ブラック" />
								<input type="hidden" name="engravingText" value="" />
								<input type="hidden" name="engravingFont" value="" />


								<button type="submit" class="btn-add-to-cart">
									<svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor"
										stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
										class="cart-icon">
										<circle cx="9" cy="21" r="1"></circle>
										<circle cx="20" cy="21" r="1"></circle>
										<path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6">
										</path>
									</svg>
									<span>買い物かごに入れる</span>
								</button>
							</form>

						</div>
					</div>

				</div>
			</div>
		</div>
	</th:block>
	<script th:inline="javascript">

		document.querySelectorAll(".btn-favorite").forEach(button => {

			button.addEventListener("click", function (e) {
				e.preventDefault(); // Prevent form submission
				e.stopPropagation();

				const itemId = this.parentElement.querySelector(".favoriteItemId").value;

				fetch(/*[[@{/client/favorite/add}]]*/"", {
					method: "POST",
					headers: {
						"Content-Type": "application/x-www-form-urlencoded"
					},
					body: "itemId=" + itemId
				})
					.then(response => response.text())
					.then(result => {

						const heart = this.querySelector(".heart-icon");

						if (result === "added") {
							// Fill the heart SVG
							heart.setAttribute("fill", "currentColor");
							heart.classList.add("favorite");
							// Reload to update favorite count in header
							setTimeout(() => {
								window.location.href = "/shared_shop";
							}, 300);
						} else if (result === "detached") {
							// Unfill the heart
							heart.setAttribute("fill", "none");
							heart.classList.remove("favorite");
							// Reload to update favorite count
							setTimeout(() => {
								window.location.href = "/shared_shop";
							}, 300);
						} else if (result === "ng") {
							alert("ログインしてください");
						}

					})
					.catch(error => {
						console.error('Fetch error:', error);
					});

			});

		});

	</script>
</body>

</html>
