<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{top}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user index">
	<div>
		<h2 class="title">
			<span th:if="${sortType==1}" th:text="#{sort.latest.title}"></span>
			<span th:if="${sortType==2 || sortType==null}" th:text="#{sort.latest.title}"></span>
		</h2>
	</div>

	<!-- 商品がない場合のメッセージ -->
	<div th:if="${#lists.isEmpty(items)}">
		<p th:text="#{msg.client.item.list.none}"></p>
	</div>

	<!-- 新着商品の一覧表示エリア -->
	<div class="item_list" th:if="${!#lists.isEmpty(items)}">
		<th:block th:each="item, status: ${items}" th:if="${status.count le 10}">
			<!-- 1件分の商品情報 -->
			<div class="item"
				style="display: inline-block; margin: 15px; vertical-align: top; width: 150px; text-align: center;">

				<!-- 1. 商品画像（クリックで詳細へ） -->
				<!-- 画像がはみ出さない -->
				<a th:href="@{/client/item/detail/}+${item.id}"
					style="display: block; width: 150px; height: 150px; overflow: hidden; background-color: #f5f5f5;">
					<img th:if="${item.image != null}" th:src="@{|/images/${item.image}|}"
						style="width: 100%; height: 100%; object-fit: cover;" />
					<img th:src="@{/images/common/no_image.jpg}" th:if="${item.image == null}"
						style="width: 100%; height: 100%; object-fit: cover;" />
				</a>

				<!-- 2. 商品名前（画像の下に配置） -->
				<div class="item_name"
					style="margin-top: 8px; font-weight: bold; font-size: 0.95em; word-break: break-all; text-align: center;">
					<a th:href="@{/client/item/detail/}+${item.id}" th:text="${item.name}"></a>
				</div>

				<!-- 3. 値段（名前の下に配置） -->
				<div class="item_price" style="margin-top: 4px; font-size: 0.9em;">
					¥<span th:text="${item.price}"></span>
				</div>

			</div>
		</th:block>

		<!-- 新着一覧へ -->
		<div class="detail_button_area">
			<a th:href="@{/client/item/list/1}">
				<input type="button" value="すべての商品をみる" />
			</a>
		</div>
	</div>


	<div>
		<h2 class="title">
			<span th:if="${sortType==1}" th:text="#{sort.ranking.title}"></span>
			<span th:if="${sortType==2 || sortType==null}" th:text="#{sort.ranking.title}"></span>
		</h2>

		<!-- ランキング表示 -->
		<div class="flex justify-center items-end gap-6 mt-16">

			<!--  Rank 2  -->
			<!--データが2件以上ある場合のみ表示-->
			<div th:if="${#lists.size(rankings) >= 2}" th:object="${rankings[1]}"
				class="relative w-56 bg-white rounded-3xl shadow-lg">

				<!-- 画像 -->
				<a th:href="@{/client/item/detail/}+*{id}"
					class="block w-[150px] h-[150px] mx-auto mt-4 overflow-hidden rounded-xl bg-gray-100">

					<img th:if="*{image != null}" th:src="@{|/images/*{image}|}" class="w-full h-full object-cover" />

					<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
						class="w-full h-full object-cover" />

				</a>

				<!-- 順位 -->
				<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">

					<img th:src="@{/images/common/crone.png}" class="w-5 h-5">

					<span class="ml-1 font-bold">
						2位
					</span>

				</div>

				<!-- 商品情報 -->
				<div class="p-4 text-center">

					<p class="font-bold" th:text="*{name}"></p>

					<p class="text-pink-600" th:text="|￥*{#numbers.formatInteger(price,3,'COMMA')}|"></p>

				</div>

			</div>
			<!-- Rank1 -->
			<div th:if="${#lists.size(rankings) >= 1}" th:object="${rankings[0]}"
				class="relative w-72 bg-white rounded-3xl shadow-xl">

				<!-- 画像 -->
				<a th:href="@{/client/item/detail/}+*{id}"
					class="block w-[220px] h-[220px] mx-auto mt-4 overflow-hidden rounded-xl bg-gray-100">

					<img th:if="*{image != null}" th:src="@{|/images/*{image}|}" class="w-full h-full object-cover" />

					<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
						class="w-full h-full object-cover" />

				</a>

				<!-- 順位 -->
				<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">
					<img th:src="@{/images/common/crone.png}" class="w-5 h-5">
					<span class="ml-1 font-bold">1位</span>
				</div>

				<!-- 商品情報 -->
				<div class="p-4 text-center">
					<p class="font-bold text-lg" th:text="*{name}"></p>

					<p class="text-pink-600 font-bold" th:text="|￥*{#numbers.formatInteger(price,3,'COMMA')}|">
					</p>
				</div>

			</div>



			<!--  Rank 3  -->
			<!--データが2件以上ある場合のみ表示-->
			<div th:if="${#lists.size(rankings) >= 3}" th:object="${rankings[2]}"
				class="relative w-56 bg-white rounded-3xl shadow-lg">

				<!-- 画像 -->
				<a th:href="@{/client/item/detail/}+*{id}"
					class="block w-[150px] h-[150px] mx-auto mt-4 overflow-hidden rounded-xl bg-gray-100">

					<img th:if="*{image != null}" th:src="@{|/images/*{image}|}" class="w-full h-full object-cover" />

					<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
						class="w-full h-full object-cover" />

				</a>

				<!-- 順位 -->
				<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">

					<img th:src="@{/images/common/crone.png}" class="w-5 h-5">

					<span class="ml-1 font-bold">
						3位
					</span>

				</div>

				<!-- 商品情報 -->
				<div class="p-4 text-center">

					<p class="font-bold" th:text="*{name}"></p>

					<p class="text-pink-600" th:text="|￥${#numbers.formatInteger(price,3,'COMMA')}|"></p>

				</div>

			</div>


			<!-- 今月のランキング商品がない場合の表示 -->
			<div th:if="${#lists.isEmpty(rankings)}" class="flex justify-center items-center min-h-100">
				<p>今月のランキングデータはありません。</p>
			</div>
		</div>
		<!-- ランキング一覧へ -->
		<div class="detail_button_area">

			<a th:href="@{/client/item/ranking}">
				<input type="button" value="ランキング一覧へ" />
			</a>
		</div>
</body>

</html>
