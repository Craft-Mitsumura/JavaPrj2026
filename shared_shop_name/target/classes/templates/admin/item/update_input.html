<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{item}+#{title.update.input}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="admin item_update_input">
	<div id="adminItemInput">
		<h2 th:class="title" th:text="#{item}+#{title.update.input}"></h2>
		<p th:class="input_message" th:text="#{msg.update.input}"></p>

		<div class="user_info_form_area">
			<form th:action="@{/admin/item/update/check}" enctype="multipart/form-data" method="post"
				class="user_info_form" th:object="${itemForm}">

				<th:block th:if="${#fields.hasErrors()}">
					<ul class="error_list">
						<li th:each="err:${#fields.detailedErrors()}" th:text="${err.message}"></li>
					</ul>
				</th:block>

				<th:block th:if="${errorMessage}">
					<ul class="error_list">
						<li th:text="${errorMessage}"></li>
					</ul>
				</th:block>
				<ul class="input_list">
					<!-- ★これが無いと更新時にIDがnullになります -->
					<input type="hidden" th:field="*{id}" />
					<li>
						<label><span class="input_title">[[#{itemForm.name}]]</span></label>
						<input type="text" th:field="*{name}" />
					</li>
					<li>
						<label><span class="input_title">[[#{itemForm.price}]]</span></label>
						<input type="text" th:field="*{price}" />
					</li>
					<li>
						<label><span class="input_title">[[#{itemForm.stock}]]</span></label>
						<input type="text" th:field="*{stock}" />
					</li>
					<li>
						<label><span class="input_title">[[#{data.category}]]</span></label>
						<select name="categoryId" id="categoryId" onchange="toggleFields()">
							<option th:each="category: ${categories}" th:value="${category.id}"
								th:text="${category.name}" th:selected="${category.id} == *{categoryId}">
							</option>
						</select>
					</li>

					<!-- ▼ 登録画面と同じ動的フィールドの記述に統一 -->
					<li class="dynamic-field" data-category="1,2,3,4,5,6"><!--個体識別ID-->
						<label><span class="input_title">[[#{itemForm.varNumber}]]</span></label>
						<input type="text" th:field="*{varNumber}" />
					</li>
					<li class="dynamic-field" data-category="1,2,3,4,5,6"><!--色-->
						<label><span class="input_title">[[#{itemForm.colorPattern}]]</span></label>
						<input type="text" th:field="*{colorPattern}" />
					</li>
					<li class="dynamic-field" data-category="1,2,6"><!--ペン先の太さ-->
						<label><span class="input_title">[[#{itemForm.nibDiameter}]]</span></label>
						<input type="text" th:field="*{nibDiameter}" />
					</li>
					<li class="dynamic-field" data-category="3,6"><!--芯の太さ-->
						<label><span class="input_title">[[#{itemForm.leadDiameter}]]</span></label>
						<input type="text" th:field="*{leadDiameter}" />
					</li>
					<li class="dynamic-field" data-category="5"><!--インク容量-->
						<label><span class="input_title">[[#{itemForm.inkVolume}]]</span></label>
						<input type="text" th:field="*{inkVolume}" />
					</li>
					<!-- JSON関連項目 ここまで -->

					<!-- 追加分(刻印機能） -->
					<li class="input_field">
						<label class="input_title">刻印サービス</label>
						<div class="checkbox_container">
							<input type="checkbox" th:field="*{isEngravable}" value="1" id="isEngravable" />
						</div>
					</li>
					<!-- 追加分(刻印機能）終わり -->
					<li>
						<label>
							<span class="input_title">[[#{itemForm.description}]]</span>
						</label>
						<textarea rows="6" th:field="*{description}"></textarea>
					</li>
					<li>
						<label><span class="input_title">[[#{data.item.image}]]</span></label>
						<input type="file" id="upload_file" name="imageFile" onchange="previewImage(this);" />
						<span th:unless="*{#strings.isEmpty(image)}">
							<img id="preview" th:src="@{/images/{image}(image=*{image})}"></img>
						</span>
						<span th:if="*{#strings.isEmpty(image)}">
							<img id="preview" th:src="@{/images/common/no_image.jpg}"></img>
						</span>
					</li>
				</ul>
				<input type="hidden" th:field="*{id}" />
				<input type="submit" value="確認" class="send_button" />
			</form>
			<form th:action="@{/admin/item/detail/{id}(id=${itemForm.id})}" method="post">
				<input type="submit" value="戻る" class="back_button" />
			</form>
		</div>
	</div>

	<!-- script追加:金城 -->
	<script>
		function toggleFields() {
			var categoryId = document.getElementById('categoryId').value;
			var fields = document.querySelectorAll('.dynamic-field');

			fields.forEach(function (field) {
				var allowedCategories = field.getAttribute('data-category').split(',');
				// 文字列としての比較にするため、categoryIdをそのまま比較
				if (allowedCategories.includes(categoryId)) {
					field.style.display = 'grid';
				} else {
					field.style.display = 'none';
					// 非表示時は値を空にする（不要なデータを送らないため）
					var input = field.querySelector('input');
					if (input) input.value = '';
				}
			});
		}
		// ▼ 画像プレビュー用関数
		function previewImage(obj) {
			var fileReader = new FileReader();
			fileReader.onload = (function () {
				document.getElementById('preview').src = fileReader.result;
			});
			if (obj.files && obj.files[0]) {
				fileReader.readAsDataURL(obj.files[0]);
			}
		}

		// ページ読み込み時と、カテゴリ変更時に実行
		document.addEventListener('DOMContentLoaded', toggleFields);
	</script>
</body>

</html>
