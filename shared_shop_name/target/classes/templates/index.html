<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{top}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user index">
	<div>
		<h2 class="title">
			<span th:if="${sortType==1}" th:text="#{sort.latest.title}"></span>
			<span th:if="${sortType==2 || sortType==null}" th:text="#{sort.latest.title}"></span>
		</h2>
	</div>

	<!-- 商品がない場合のメッセージ -->
	<div th:if="${#lists.isEmpty(items)}">
		<p th:text="#{msg.client.item.list.none}"></p>
	</div>

	<!-- 新着商品の一覧表示エリア -->
	<div id="itemList">
		<div class="item_list" th:if="${!#lists.isEmpty(items)}">
			<th:block th:each="item, status: ${items}"
				th:if="${status.count le 10}">
				<!-- 1件分の商品情報 -->
				<div class="itemList">

					<!-- 1. 商品画像（クリックで詳細へ） -->
					<!-- 画像がはみ出さない -->
					<a th:href="@{/client/item/detail/}+${item.id}"> <img
						th:if="${item.image != null}" th:src="@{|/images/${item.image}|}" />
						<img th:src="@{/images/common/no_image.jpg}"
						th:if="${item.image == null}" />
					</a>

					<!-- 2. 商品名前（画像の下に配置） -->
					<div class="item_name">
						<a th:href="@{/client/item/detail/}+${item.id}"
							th:text="${item.name}"></a>
					</div>

					<!-- 3. 値段（名前の下に配置） -->
					<div class="item_price">
						¥<span th:text="${item.price}"></span>
					</div>

				</div>
			</th:block>

			<!-- 新着一覧へ -->
			<div class="detail_button_area">
				<a th:href="@{/client/item/list/1}"> <input id="moreBtn" type="button"
					value="もっとみる" />
				</a>
			</div>
		</div>

	</div>
	<div>
		<h2 class="title">
			<span th:if="${sortType==1}" th:text="#{sort.ranking.title}"></span>
			<span th:if="${sortType==2 || sortType==null}" th:text="#{sort.ranking.title}"></span>
		</h2>

		<!-- ランキング表示 -->
		<div class="ranking-area">


			<!--  Rank 2  -->
			<!--データが2件以上ある場合のみ表示-->
			<a th:if="${#lists.size(rankings) >= 2}" th:object="${rankings[1]}" th:href="@{/client/item/detail/}+*{id}"
				class="rank-card">
				<!-- 画像 -->
				<div class="rank-image">

					<img th:if="*{image != null}" th:src="@{|/images/*{image}|}" class="w-full h-full object-cover" />

					<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
						class="w-full h-full object-cover" />

				</div>

				<!-- 順位 -->
				<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">

					<img th:src="@{/images/common/crone.png}" class="w-5 h-5">

					<span class="ml-1 font-bold">
						2位
					</span>

				</div>

				<!-- 商品情報 -->
				<div class="rank-info">
					<p class="rank-name" th:text="*{name}"></p>
					<p class="rank-price" th:text="|￥*{#numbers.formatInteger(price,3,'COMMA')}|">
					</p>
				</div>

			</a>


			<!-- Rank1 -->
			<a th:if="${#lists.size(rankings) >= 1}" th:object="${rankings[0]}" th:href="@{/client/item/detail/}+*{id}"
				class="rank-card-first">

				<!-- 画像 -->
				<div class="rank-image-first">

					<img th:if="*{image != null}" th:src="@{|/images/*{image}|}" class="w-full h-full object-cover" />

					<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
						class="w-full h-full object-cover" />

				</div>

				<!-- 順位 -->
				<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">
					<img th:src="@{/images/common/crone.png}" class="w-5 h-5">
					<span class="ml-1 font-bold">1位</span>
				</div>

				<!-- 商品情報 -->
				<div class="rank-info">
					<p class="rank-name" th:text="*{name}"></p>
					<p class="rank-price" th:text="|￥*{#numbers.formatInteger(price,3,'COMMA')}|">
					</p>
				</div>





				<!--  Rank 3  -->
				<!--データが2件以上ある場合のみ表示-->
				<a th:if="${#lists.size(rankings) >= 3}" th:object="${rankings[2]}"
					th:href="@{/client/item/detail/}+*{id}" class="rank-card">

					<!-- 画像 -->
					<div class="rank-image">

						<img th:if="*{image != null}" th:src="@{|/images/*{image}|}"
							class="w-full h-full object-cover" />

						<img th:if="*{image == null}" th:src="@{/images/common/no_image.jpg}"
							class="w-full h-full object-cover" />

					</div>

					<!-- 順位 -->
					<div class="absolute top-3 left-3 flex items-center bg-white rounded-full shadow px-3 py-1">

						<img th:src="@{/images/common/crone.png}" class="w-5 h-5">

						<span class="ml-1 font-bold">
							3位
						</span>

					</div>

					<!-- 商品情報 -->
					<div class="rank-info">
						<p class="rank-name" th:text="*{name}"></p>
						<p class="rank-price" th:text="|￥*{#numbers.formatInteger(price,3,'COMMA')}|">
						</p>
					</div>

		</div>
	</div>
