<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{user}+#{title.detail}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body class="user user_detail">
	<div id="details">

		<h2 th:class="title" th:text="#{user}+#{title.detail}"  style="margin-top:2%;"></h2>

		<!-- 上段 -->
		<div class="top_area">

			<!-- 会員情報 -->
			<div class="detail_area">

				<ul class="input_list" th:object="${userBean}">
					<li>
						<span class="input_title">[[#{userForm.email}]]</span>
						<span class="input_value" th:text="*{email}"></span>
					</li>

					<li>
						<span class="input_title">[[#{userForm.name}]]</span>
						<span class="input_value" th:text="*{name}"></span>
					</li>

					<li>
						<span class="input_title">[[#{userForm.postalCode}]]</span>
						<span class="input_value" th:text="*{postalCode}"></span>
					</li>

					<li>
						<span class="input_title">[[#{userForm.address}]]</span>
						<span class="input_value" th:text="*{address}"></span>
					</li>

					<li style="border-bottom:none;">
						<span class="input_title">[[#{userForm.phoneNumber}]]</span>
						<span class="input_value" th:text="*{phoneNumber}"></span>
					</li>
				</ul>

			</div>

			<!-- ポイント情報 -->
			<div class="point_area">

				<div class="next_prize" th:if="${nextPrizeName != null}">
					<a style="margin-bottom:2%;" th:href="@{/client/prize/list}">
						<p   class="title">次の景品</p>
                      <div id="next_price"> 
						<img style="height:190px;" id="nextPrizeImg" th:src="@{/images/{file}(file=${nextPrizeImage})}" alt="景品画像">

						<p class="prize_name"  th:text="  '商品名　:  '  + ${ nextPrizeName} "></p>

						<p class="prize_point" th:text="${'次回　:   ' + #numbers.formatDecimal(nextPrizePoint, 0, 'COMMA', 0, 'POINT') + 'ptで交換'}"></p>
						
					</div>
					</a>
					
				</div>
				<div id="pointDiv" > 
				<div class="current_point">
					<p>現在ポイント</p>
					<p 	th:text="${#numbers.formatDecimal(userBean.point, 0, 'COMMA', 0, 'POINT') + 'pt'}"></p>
				
				</div>

				<div class="next_point">
					<p>次の景品まで</p>
					<p th:text="${#numbers.formatDecimal(remainPoint, 0, 'COMMA', 0, 'POINT') + 'pt'}"></p>
				</div>


				<div th:if="${nextPrizeName == null}">
					<p>すべての景品を獲得済みです！</p>
				</div>
               </div>
			</div> <!-- point_area -->
		</div> <!-- top_area -->

		
		<!-- 注文一覧 -->
		<div class="order_history">

			<h3>注文一覧</h3>

			<!-- 注文がある場合 -->
			<table th:if="${orderList != null and !orderList.isEmpty()}">
				<thead>
					<tr>
						<th>購入日時</th>
						<th>支払方法</th>
						<th>購入数</th>
						<th>購入金額</th>
					</tr>
				</thead>

				<tbody>
					<tr th:each="order : ${orderList}">

						<!-- 購入日時 -->
						<td>
							<a th:href="@{/client/order/detail/{id}(id=${order.id})}"
							   th:text="${order.insertDate}">
							</a>
						</td>

						<!-- 支払方法 -->
						<td th:switch="${order.payMethod}">
							<span th:case="1">クレジットカード</span>
							<span th:case="2">銀行振込</span>
							<span th:case="3">着払い</span>
							<span th:case="4">電子マネー</span>
							<span th:case="5">コンビニ決済</span>
						</td>

						<!-- 購入数 -->
						<td>
							<div th:each="orderItem : ${order.orderItemsList}">
								<span th:text="${orderItem.quantity}"></span>個
							</div>
						</td>

						<!-- 購入金額 -->
						<td>
							<div th:each="orderItem : ${order.orderItemsList}">
								<span th:text="${#numbers.formatDecimal((orderItem.price * orderItem.quantity), 0, 'COMMA', 0, 'POINT')}"></span>円
							</div>
						</td>

					</tr>
				</tbody>
			</table>
				<h1 th:text="${total}" >hello</h1>

			<!-- 注文がない場合 -->
			<p  th:if="${orderList == null or orderList.isEmpty()}" style = "margin:auto; text-align:center;">
				お客様の注文履歴がありません
				
			</p>

		</div>


		<!-- ボタン -->
		<div class="detail_button_area">

			<form th:action="@{/}" method="post">
				<input type="submit" value="戻る" class="back_button" />
			</form>

			<form th:action="@{/client/user/update/input_init}" method="post">
				<input type="submit" value="変更" class= changeBtn />
			</form>

			<form th:action="@{/client/user/delete/check}" method="post">
				<input id="deleteBtn" type="submit" value="退会" class="delete" />
			</form>

		</div>

	</div>
</body>

</html>
