<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_5block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{item}+#{title.list}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body th:object="${loginForm}" class="user item_list">
<div id="itemList">

    <h2 class="title" th:text="#{item}+#{title.list}"></h2>

    <div class="sorted_by">

        <span th:if="${sortType==1}" th:text="#{sort.latest.str}"></span>
        <a th:unless="${sortType==1}"
           th:href="@{/client/item/list/1(categoryId=${categoryId})}"
           th:text="#{sort.latest.str}"></a>

        <span th:if="${sortType==2}" th:text="#{sort.hotsell.str}"></span>
        <a th:unless="${sortType==2}"
           th:href="@{/client/item/list/2(categoryId=${categoryId})}"
           th:text="#{sort.hotsell.str}"></a>

    </div>

    <p class="noItem"
       th:if="${#lists.isEmpty(items)}"
       th:text="#{msg.client.item.list.none}">
    </p>

    <div class="item-grid" th:if="!${#lists.isEmpty(items)}">

        <div class="item-card"
             th:each="item : ${items}">

            <a class="item-image"
               th:href="@{/client/item/detail/{id}(id=${item.id})}">

                <img th:if="${item.image!=null}"
                     th:src="@{/images/{image}(image=${item.image})}">

                <img th:unless="${item.image!=null}"
                     th:src="@{/images/common/no_image.jpg}">

            </a>

            <div class="item-info">

                <div class="category"
                     th:text="${item.category.Name}">
                </div>

                <div class="name">

                    <a th:href="@{/client/item/detail/{id}(id=${item.id})}"
                       th:text="${item.name}">
                    </a>

                </div>

                <div class="price">

                    ¥<span th:text="${item.price}"></span>

                </div>

            </div>

        </div>

    </div>

</div>
</body>

</html>
