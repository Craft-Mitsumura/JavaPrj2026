<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
	th:replace="~{common/layout_4block :: layout(~{::title},~{::body/content()})}">

<head>
	<title th:text="#{title.order.complete}+' | '+ #{shop.title}"> </title>
	<meta charset="UTF-8" />
</head>

<body >
<div class="complete-container">

    <div class="complete-card">

        <div class="check-icon">
            ✓
        </div>

       <h1 th:class="title" th:text="#{title.order.complete}"></h1>

        <p th:class="complete_message">
		<span th:text="#{msg.order.complete1}"></span>
		<br />
		<span th:text="#{msg.order.complete2}"></span>
	</p>

        <a th:href="@{/}" th:text="#{msg.back.to.top}" class="home-btn">
            ホームへ戻る
        </a>

    </div>

</div>	
</body>

</html>
